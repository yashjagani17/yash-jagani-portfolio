name: terraform apply (dev/stage)
on:
   push:
     branches: [dev]
   pull_request:
    branches: [dev]
   workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  website:
    runs-on: ubuntu-latest
    outputs:
      bucket: ${{ steps.output.outputs.bucket }}
    defaults:
      run:
        working-directory: live/stage/services/website
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: terraform init
      - run: terraform validate
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'live/stage/services/website'
          trivyignores: 'live/stage/services/website/.trivyignore'
          hide-progress: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      - if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
      - run: terraform plan -out=tfplan
      - if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan
      - id: output
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: echo "bucket=$(terraform output -raw bucket_name)" >> "$GITHUB_OUTPUT"
  services:
    needs: website
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - 'live/stage/services/weather-app'
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps: 
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: terraform init
      - run: terraform validate
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '${{ matrix.service }}'
          trivyignores: '${{ matrix.service }}/.trivyignore'
          hide-progress: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      - if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
      - run: terraform plan -out=tfplan
      - if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan

  sync-website:
    needs: [website, services]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Get weather-app endpoint
        id: weather
        working-directory: live/stage/services/weather-app
        run: |
          terraform init
          echo "api_url=$(terraform output -raw api_endpoint | sed 's:/*$::')" >> "$GITHUB_OUTPUT"

      - name: Build and sync website
        run: |
          mkdir -p build
          cp -r website/* build/
          sed -i "s|https://[a-z0-9]*\.execute-api\.eu-west-2\.amazonaws\.com|${{ steps.weather.outputs.api_url }}|g" build/weather.html build/projects.html
          aws s3 sync build/ "s3://${{ needs.website.outputs.bucket }}" --delete